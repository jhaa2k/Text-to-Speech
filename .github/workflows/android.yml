name: Build VOX STUDIO Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, feature/vox-studio-android]
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.gradle/caches
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip
          pip install buildozer cython==3.1.2
      - name: Build debug APK
        run: buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vox-studio-debug-apk
          path: bin/*.apk
          if-no-files-found: error
